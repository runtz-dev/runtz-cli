# GoReleaser config for the runtz CLI.
# Release flow (see RELEASING.md): tag vX.Y.Z[-rcN], then run:
#   goreleaser release --clean
# Requires GITHUB_TOKEN with write access to runtz-dev/runtz-cli.
version: 2

project_name: runtz

builds:
  - id: runtz
    dir: .
    main: ./cmd/runtz
    binary: runtz
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows/arm64 is niche enough to skip for now; add it back here
      # if it's ever needed.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/runtz-dev/runtz-cli/internal/version.Version={{ .Version }}

# Publish raw binaries named exactly as install.sh/install.ps1 expect:
#   runtz_<os>_<arch>       (e.g. runtz_linux_amd64)
#   runtz_windows_amd64.exe (GoReleaser appends .exe for windows automatically)
archives:
  - id: binaries
    formats: [binary]
    name_template: "runtz_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: runtz-dev
    name: runtz-cli
  draft: false
  prerelease: auto
