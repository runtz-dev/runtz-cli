---
name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  binaries:
    name: Publish binaries (GitHub Releases)
    runs-on:
      - runtz-runners
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Publish image (Docker Hub)
    runs-on:
      - runtz-runners
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push multi-arch image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="--tag runtzdev/runtz-cli:${VERSION}"
          case "$VERSION" in
            *-*) ;;                                    # pre-release: version tag only
            *) TAGS="$TAGS --tag runtzdev/runtz-cli:latest" ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $TAGS \
            --build-arg LDFLAGS="-s -w -X github.com/runtz-dev/runtz-cli/internal/version.Version=${VERSION}" \
            --push \
            .
